name: Bootstrap v1.0.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-v1-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create v1.0.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 358cf307e15ac9ba1fd8cd7d502240331a118c32
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 release already exists; nothing to do."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          ## Yoya Portfolio v1.0.0

          第一個正式追蹤的 Portfolio 網頁版本。

          - 以 `data/projects.json` 集中管理作品名稱、順序、Demo、GitHub、標籤與 Case Study 路徑。
          - 中英文首頁包含四個 Selected Work 與一個 Additional System。
          - 提供 Case Study、公開 Demo、雙語 CV、SEO / JSON-LD、sitemap 與 GitHub Pages CI/CD。
          - 加入網頁版本資訊：Footer、HTML metadata、`/version.json` 與 Git commit 對應。

          對應網站版本：`1.0.0`
          EOF

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Yoya Portfolio v1.0.0" \
            --notes-file release-notes.md \
            --latest
