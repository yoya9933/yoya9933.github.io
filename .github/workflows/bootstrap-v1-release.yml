name: Bootstrap v1.0.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-v1-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "1.0.0"
          grep -q '^## v1\.0\.0 ' CHANGELOG.md

      - name: Extract v1.0.0 release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^## v1\.0\.0 / { capture=1; next }
            /^## v/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create Git tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; keeping the existing tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "Yoya Portfolio ${tag}"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md
          fi
