name: Deploy Static Webpage to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build raster social and app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/og-image.svg -o assets/og-image.png
          rsvg-convert -w 180 -h 180 assets/favicon.svg -o assets/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 assets/favicon.svg -o assets/icon-192.png
          rsvg-convert -w 512 -h 512 assets/favicon.svg -o assets/icon-512.png

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
