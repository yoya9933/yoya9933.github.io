name: Deploy Static Webpage to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin webp weasyprint ghostscript fonts-noto-cjk

      - name: Build allowlisted site
        run: bash scripts/build_site.sh

      - name: Verify deployment artifact
        run: python3 scripts/check_site.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
