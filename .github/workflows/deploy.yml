name: Release and Deploy Portfolio

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate VERSION and CHANGELOG
        run: python3 scripts/release_notes.py > release-notes.md

      - name: Enforce immutable version and create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          git fetch --force --tags origin

          tag_commit=""
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "ERROR: $tag is already locked to $tag_commit, but this deployment is $GITHUB_SHA." >&2
              echo "Bump VERSION and add a matching CHANGELOG.md release before deploying new code." >&2
              exit 1
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -z "$tag_commit" ]; then
              echo "ERROR: GitHub Release $tag exists but its Git tag was not found." >&2
              exit 1
            fi
            echo "$tag already exists at this exact commit; release identity is unchanged."
            exit 0
          fi

          if [ -n "$tag_commit" ]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yoya Portfolio $tag" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Yoya Portfolio $tag" \
              --notes-file release-notes.md \
              --latest
          fi

  deploy:
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin webp ghostscript fonts-noto-cjk qrencode
          google-chrome --version

      - name: Build allowlisted site
        run: bash scripts/build_site.sh

      - name: Verify deployment artifact
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_build_manifest.py
          python3 scripts/check_observability.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify production release identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_ATTEMPTS: "12"
          SMOKE_DELAY_SECONDS: "5"
        run: |
          export EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/verify_production.py
