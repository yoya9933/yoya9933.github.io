name: Finalize profile crop

on:
  push:
    branches:
      - ponytail/profile-crop

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ponytail/profile-crop
          fetch-depth: 0
      - name: Update release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path('VERSION')
          version.write_text('1.7.6\n')
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '# Changelog\n\n網站版本遵循 Semantic Versioning（SemVer）：`MAJOR.MINOR.PATCH`。\n\n'
          entry = '''## v1.7.6 — 2026-09-11

Profile Crop Fix：重新裁切首頁 Hero 個人照，保留頭頂上方留白，避免圓角方框切到頭髮。

- 直接替換既有 `assets/profile.jpg`，不增加 CSS hack、JavaScript、圖片 loader 或 dependency。
- 維持 320×320 本地 JPEG、既有 CSP 與圖片品質驗證。
- 這次修正的是圖片內容裁切，不再靠移動整個頭像區塊處理。

'''
          if '## v1.7.6 — 2026-09-11' not in text:
              if marker not in text:
                  raise SystemExit('changelog marker missing')
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text)
          PY
      - name: Commit final release files and remove temporary workflow
        run: |
          rm .github/workflows/finalize-profile-crop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.7.6 profile crop fix"
          git push origin HEAD:ponytail/profile-crop
