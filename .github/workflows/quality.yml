name: Site Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-dependencies

      - name: Validate VERSION and CHANGELOG release metadata
        run: python3 scripts/render_changelog.py --release-notes > /tmp/release-notes.md

      - name: Build and validate allowlisted site
        run: bash scripts/build_site.sh

      - name: Validate HTML
        run: find _site -name '*.html' -print0 | xargs -0 npx --yes html-validate@8

      - name: Prepare Lighthouse site copy
        uses: ./.github/actions/prepare-lighthouse-site

      - name: Run Lighthouse CI on indexable pages
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lhci_reports
          if-no-files-found: ignore
          retention-days: 7
