name: Site Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-dependencies

      - name: Build and validate allowlisted site
        run: bash scripts/build_site.sh
