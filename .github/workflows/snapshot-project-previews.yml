name: Snapshot real project previews

on:
  workflow_dispatch:
  push:
    branches:
      - visual-refresh-real-screenshots
    paths:
      - .github/workflows/snapshot-project-previews.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: visual-refresh-real-screenshots

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          google-chrome --version

      - name: Capture immutable project previews
        run: |
          set -euo pipefail
          mkdir -p assets/projects/snapshots

          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/yoya9933/Buoy-data-analysis-V2/cce54f23789e8d84b4e51cc36f19fc7b8238b4cb/docs/portfolio/buoy-runtime.png' \
            -o /tmp/buoy.png

          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/yoya9933/chess-online/fd8529d0cf5c11b702e742ee21a8dc97eb975126/public/og.png' \
            -o /tmp/chess.png

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --hide-scrollbars --window-size=1200,720 --virtual-time-budget=5000 \
            --screenshot=/tmp/ncku-return-os.png \
            'https://raw.githack.com/yoya9933/ncku-credit-map_202606210334_XY/1a8c01b1178181eee242c94d8fc5602d10fb679a/index.html'

          cwebp -quiet -q 86 /tmp/buoy.png -o assets/projects/snapshots/buoy.webp
          cwebp -quiet -q 86 /tmp/chess.png -o assets/projects/snapshots/chess.webp
          cwebp -quiet -q 86 /tmp/ncku-return-os.png -o assets/projects/snapshots/ncku-return-os.webp

          file assets/projects/snapshots/*.webp

      - name: Commit snapshots to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/snapshots/*.webp
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi
          git commit -m 'assets: snapshot real project previews'
          git push origin HEAD:visual-refresh-real-screenshots
