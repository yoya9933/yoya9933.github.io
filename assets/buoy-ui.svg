    <text x="340" y="245" font-size="19" font-weight="700" fill="#262730">缺值 / 離群值檢查</text>
    <rect x="590" y="178" width="252" height="92" rx="10" fill="#fff" stroke="#e4e7ec"/>
    <text x="610" y="208" font-size="13" fill="#748091">MODEL</text>
    <text x="610" y="245" font-size="19" font-weight="700" fill="#262730">LSTM 時間序列預測</text>
    <rect x="860" y="178" width="280" height="92" rx="10" fill="#fff" stroke="#e4e7ec"/>
    <text x="880" y="208" font-size="13" fill="#748091">VALIDATION + RISK</text>
    <text x="880" y="245" font-size="19" font-weight="700" fill="#262730">RMSE / R / 風險門檻</text>

    <rect x="320" y="302" width="820" height="275" rx="12" fill="#fcfcfd" stroke="#e5e7eb"/>
