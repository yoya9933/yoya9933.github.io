<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">浮標資料分析平台介面預覽</title>
  <desc id="d">依實際 Streamlit app.py 與 LSTM 頁面原始碼重建的介面預覽。</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect width="260" height="675" fill="#f0f2f6"/>
  <line x1="260" y1="0" x2="260" y2="675" stroke="#d9dde5"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="28" y="48" font-size="19" font-weight="800" fill="#262730">🌊 浮標資料分析平台</text>
    <rect x="22" y="82" width="216" height="48" rx="8" fill="#fff" stroke="#dfe3e8"/>
    <text x="40" y="113" font-size="16" fill="#4b5563">首頁</text>
    <rect x="22" y="142" width="216" height="58" rx="8" fill="#e6f4f1" stroke="#2aa889"/>
