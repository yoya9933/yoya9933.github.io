    <text x="992" y="555" font-size="13" fill="#e15759">未來預測</text>
    <text x="320" y="625" font-size="13" fill="#697386">Source-faithful UI reconstruction from app.py and pages/10_🌊_LSTM模型預測(beta).py</text>
