    <rect x="22" y="272" width="216" height="48" rx="8" fill="#fff" stroke="#dfe3e8"/>
    <text x="40" y="303" font-size="16" fill="#4b5563">⚙️ 風險門檻</text>

    <text x="320" y="78" font-size="42" font-weight="800" fill="#262730">🌊 海洋數據 LSTM 模型預測</text>
    <text x="320" y="116" font-size="18" fill="#4b5563">使用長短期記憶 (LSTM) 類神經網絡預測海洋數據的未來趨勢。</text>
    <line x1="320" y1="142" x2="1140" y2="142" stroke="#e4e7ec"/>

    <rect x="320" y="178" width="252" height="92" rx="10" fill="#fff" stroke="#e4e7ec"/>
