<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Reliable AI Media Automation Pipeline</title><desc id="desc">A dark technical diagram showing source ingestion, deduplication, editorial selection, media generation, publishing adapters, and observability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2635"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020817" flood-opacity=".42"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1035" cy="70" r="190" fill="#2dd4bf" opacity=".08"/><circle cx="100" cy="620" r="230" fill="#7dd3fc" opacity=".06"/>
<g font-family="Inter,Arial,sans-serif"><text x="70" y="82" fill="#5eead4" font-size="17" font-weight="800" letter-spacing="3">RELIABLE AI MEDIA AUTOMATION</text><text x="70" y="132" fill="#eff6ff" font-size="42" font-weight="850">From source selection to recoverable publishing</text><text x="70" y="169" fill="#9fb0c7" font-size="18">Deduplication · audit trail · failure recovery · multi-platform adapters</text></g>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
<g transform="translate(65 240)"><rect width="160" height="180" rx="18" fill="#0e2036" stroke="#28506a"/><text x="22" y="40" fill="#7dd3fc" font-size="13" font-weight="800">01 / SOURCES</text><text x="22" y="82" fill="#eff6ff" font-size="21" font-weight="800">RSS Feeds</text><text x="22" y="113" fill="#9fb0c7" font-size="14">4 topic profiles</text><text x="22" y="137" fill="#9fb0c7" font-size="14">full-text fallback</text><text x="22" y="161" fill="#9fb0c7" font-size="14">source metadata</text></g>
<g transform="translate(250 240)"><rect width="160" height="180" rx="18" fill="#0e2036" stroke="#28506a"/><text x="22" y="40" fill="#7dd3fc" font-size="13" font-weight="800">02 / GUARD</text><text x="22" y="82" fill="#eff6ff" font-size="21" font-weight="800">Dedup State</text><text x="22" y="113" fill="#9fb0c7" font-size="14">seen.json</text><text x="22" y="137" fill="#9fb0c7" font-size="14">profile filters</text><text x="22" y="161" fill="#9fb0c7" font-size="14">event de-dup</text></g>
<g transform="translate(435 240)"><rect width="160" height="180" rx="18" fill="#0e2036" stroke="#2dd4bf"/><text x="22" y="40" fill="#5eead4" font-size="13" font-weight="800">03 / EDITOR</text><text x="22" y="82" fill="#eff6ff" font-size="21" font-weight="800">LLM Select</text><text x="22" y="113" fill="#9fb0c7" font-size="14">editorial brief</text><text x="22" y="137" fill="#9fb0c7" font-size="14">local score fallback</text><text x="22" y="161" fill="#9fb0c7" font-size="14">dry-run review</text></g>
<g transform="translate(620 240)"><rect width="160" height="180" rx="18" fill="#0e2036" stroke="#28506a"/><text x="22" y="40" fill="#7dd3fc" font-size="13" font-weight="800">04 / BUILD</text><text x="22" y="82" fill="#eff6ff" font-size="21" font-weight="800">Media Task</text><text x="22" y="113" fill="#9fb0c7" font-size="14">script · TTS</text><text x="22" y="137" fill="#9fb0c7" font-size="14">captions · assets</text><text x="22" y="161" fill="#9fb0c7" font-size="14">video composition</text></g>
<g transform="translate(805 240)"><rect width="160" height="180" rx="18" fill="#0e2036" stroke="#28506a"/><text x="22" y="40" fill="#7dd3fc" font-size="13" font-weight="800">05 / PUBLISH</text><text x="22" y="82" fill="#eff6ff" font-size="21" font-weight="800">Adapters</text><text x="22" y="113" fill="#9fb0c7" font-size="14">YouTube</text><text x="22" y="137" fill="#9fb0c7" font-size="14">Instagram Reels</text><text x="22" y="161" fill="#9fb0c7" font-size="14">Facebook Reels</text></g>
<g transform="translate(990 240)"><rect width="145" height="180" rx="18" fill="#0e2036" stroke="#2dd4bf"/><text x="18" y="40" fill="#5eead4" font-size="13" font-weight="800">06 / OPS</text><text x="18" y="82" fill="#eff6ff" font-size="20" font-weight="800">Observe</text><text x="18" y="113" fill="#9fb0c7" font-size="13">job records</text><text x="18" y="137" fill="#9fb0c7" font-size="13">publish status</text><text x="18" y="161" fill="#9fb0c7" font-size="13">alerts + reports</text></g>
</g>
<g stroke="#5eead4" stroke-width="3" fill="none" opacity=".8"><path d="M225 330h25"/><path d="M410 330h25"/><path d="M595 330h25"/><path d="M780 330h25"/><path d="M965 330h25"/></g>
<g fill="#5eead4"><path d="M246 324l10 6-10 6z"/><path d="M431 324l10 6-10 6z"/><path d="M616 324l10 6-10 6z"/><path d="M801 324l10 6-10 6z"/><path d="M986 324l10 6-10 6z"/></g>
<g font-family="Inter,Arial,sans-serif"><rect x="70" y="485" width="1060" height="112" rx="18" fill="#0a1a2b" stroke="#213d53"/><text x="96" y="523" fill="#5eead4" font-size="14" font-weight="800">RECOVERY LOOP</text><text x="96" y="555" fill="#eff6ff" font-size="18" font-weight="750">pending_upload.json keeps a generated video recoverable after an upload failure.</text><text x="96" y="582" fill="#9fb0c7" font-size="15">The next run retries the pending publish before generating another video; job, source and platform results stay traceable.</text></g>
</svg>