    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e375f"/><stop offset="1" stop-color="#263f70"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#28456e" flood-opacity=".13"/>
    </filter>
