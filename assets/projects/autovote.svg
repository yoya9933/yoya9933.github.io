<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AutoVote 股東電子投票輔助平台架構示意</title>
  <desc id="desc">展示 Google 客戶登入與授權、本機 Edge 與 Playwright 查詢集保既有投票、匯出 22 筆官方電投圖。新票送出功能尚未啟用。純架構示意，無真實客戶資料。</desc>
