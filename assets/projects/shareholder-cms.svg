<path d="M1005 515H1080" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/><path d="m1065 500 20 15-20 15" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="790" fill="#c5eafe" font-family="monospace" font-size="22">Vue 3 · TypeScript · Supabase · PostgreSQL · Storage · SEO</text>
